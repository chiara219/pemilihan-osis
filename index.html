<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#0d47a1"
  >

  <meta
    name="description"
    content="Aplikasi Pemilihan Ketua dan Wakil Ketua OSIS SMP Negeri 1 Rambang Niru"
  >

  <title>Pemilihan Ketua & Wakil Ketua OSIS</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">

  <!-- ICON APLIKASI -->
  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./icons/icon-192.png"
  >

  <link
    rel="apple-touch-icon"
    href="./icons/icon-192.png"
  >

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
  crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="style.css?v=11"
  >

  <style>

    /* =========================================
       LOGO PEMILIHAN OSIS
       ========================================= */

    .app-logo-header {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 20px 10px;
    }

    .app-logo-header img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,.25));
    }

    .app-title-header {
      text-align: center;
      padding: 0 20px 20px;
    }

    .app-title-header h1 {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
    }

    .app-title-header p {
      margin: 5px 0 0;
      font-family: 'Poppins', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,.75);
    }

    /* Logo lebih kecil di HP */
    @media(max-width:480px){

      .app-logo-header {
        padding-top: 18px;
      }

      .app-logo-header img {
        width: 90px;
        height: 90px;
      }

      .app-title-header h1 {
        font-size: 19px;
      }

    }

  </style>

</head>


<body>

  <!-- =====================================
       HEADER LOGO APLIKASI
       ===================================== -->

  <header class="app-logo-header">

    <img
      src="./icons/icon-192.png"
      alt="Logo Pemilihan OSIS"
    >

  </header>


  <div class="app-title-header">

    <h1>
      PEMILIHAN KETUA & WAKIL KETUA OSIS
    </h1>

    <p>
      SMP NEGERI 1 RAMBANG NIRU
    </p>

  </div>


  <!-- =====================================
       INSTALL APPLICATION
       ===================================== -->

  <div
    id="installBox"
    hidden
  >

    <span>
      Instal aplikasi OSIS
    </span>

    <button
      id="installBtn"
      type="button"
    >
      Instal
    </button>

  </div>


  <!-- =====================================
       MAIN APPLICATION
       ===================================== -->

  <div id="app">

    <main class="container">

      <section class="sheet">

        <p class="eyebrow">
          PEMILIHAN UMUM OSIS
        </p>

        <h1 class="headline">
          Memuat aplikasi...
        </h1>

        <p class="sub">
          Mohon tunggu sebentar.
        </p>

      </section>

    </main>

  </div>


  <!-- =====================================
       CONFIG
       ===================================== -->

  <script>

    window.APP_CONFIG = {

      APP_NAME:
        "Pemilihan Ketua & Wakil Ketua OSIS",

      SCHOOL:
        "SMP NEGERI 1 RAMBANG NIRU",

      API_URL:
        "https://script.google.com/macros/s/AKfycbxaodCn1qHb75ssvk-M_JnM2lr4no1UQ2dT-TgPvVacmtlt8QFNyo_EHmfKC_4rsaRlpg/exec"

    };

  </script>


  <!-- =====================================
       APPLICATION SCRIPT
       ===================================== -->

  <script src="app.js?v=2026092218"></script>


  <!-- =====================================
       SERVICE WORKER PWA
       ===================================== -->

  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener("load", function() {

        navigator.serviceWorker.register("./sw.js")
          .then(function(registration) {

            console.log(
              "Service Worker aktif:",
              registration.scope
            );

          })
          .catch(function(error) {

            console.log(
              "Service Worker belum aktif:",
              error
            );

          });

      });

    }

  </script>


</body>
</html>
