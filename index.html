<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#0d47a1"
  >

  <meta
    name="description"
    content="Aplikasi Pemilihan Ketua dan Wakil Ketua OSIS"
  >

  <title>Pemilihan Ketua & Wakil Ketua OSIS</title>

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="icon"
    href="icons/icon-192.png"
  >

  <link
    rel="apple-touch-icon"
    href="icons/icon-192.png"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css?v=10"
  >

</head>

<body>

  <!-- =========================
       INSTALL APPLICATION
  ========================== -->

  <div
    id="installBox"
    hidden
  >

    <span>
      Instal aplikasi OSIS
    </span>

    <button
      id="installBtn"
      type="button"
    >
      Instal
    </button>

  </div>


  <!-- =========================
       MAIN APPLICATION
  ========================== -->

  <div id="app">

    <main class="container">

      <section class="sheet">

        <p class="eyebrow">
          PEMILIHAN UMUM OSIS
        </p>

        <h1 class="headline">
          Memuat aplikasi...
        </h1>

        <p class="sub">
          Mohon tunggu sebentar.
        </p>

      </section>

    </main>

  </div>


  <!-- =========================
       CONFIG
  ========================== -->

  <script>

    /*
      =====================================================
      KONFIGURASI APLIKASI
      =====================================================

      JANGAN mengubah API_URL jika alamat Apps Script
      yang sekarang sudah bekerja di laptop.

    */

    window.APP_CONFIG = {

      APP_NAME:
        "Pemilihan Ketua & Wakil Ketua OSIS",

      SCHOOL:
        "SMP NEGERI 1 RAMBANG NIRU",

      API_URL:
        "https://script.google.com/macros/s/AKfycbxaodCn1qHb75ssvk-M_JnM2lr4no1UQ2dT-TgPvVacmtlt8QFNyo_EHmfKC_4rsaRlpg/exec"

    };

  </script>


  <!-- =========================
       APPLICATION SCRIPT
  ========================== -->

  <script
    src="app.js?v=10"
    defer
  ></script>


</body>
</html>
